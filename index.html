<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kamizu</title>
    
    <!-- Подключение шрифтов: MedievalSharp и Cinzel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=MedievalSharp&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #040407;
            --text-main: #f5f5f7;
            --text-dim: #8b8b96;
            --ease-liquid: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            cursor: default;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(ellipse at 50% 15%, rgba(65, 65, 90, 0.45) 0%, transparent 60%),
                radial-gradient(circle at 85% 85%, rgba(45, 45, 65, 0.35) 0%, transparent 55%),
                radial-gradient(circle at 15% 90%, rgba(35, 35, 55, 0.4) 0%, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            font-family: 'Cinzel', serif;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 24px 0;
            position: relative;
        }

        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0.012) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 3px;
            z-index: 2;
            pointer-events: none;
        }

        a, button, input[type="range"] {
            cursor: pointer;
        }

        #ashCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            pointer-events: none;
        }

        /* --- ОСНОВНАЯ КАРТОЧКА --- */
        .container {
            position: relative;
            z-index: 10; 
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 440px;
            padding: 44px 30px;
            border-radius: 36px;
            
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.015) 50%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            
            box-shadow: 
                0 35px 80px rgba(0, 0, 0, 0.75),
                inset 0 2px 2px rgba(255, 255, 255, 0.6),
                inset 0 -2px 3px rgba(0, 0, 0, 0.4),
                inset 2px 0 3px rgba(255, 255, 255, 0.15),
                inset -2px 0 3px rgba(255, 255, 255, 0.15);
            
            opacity: 0;
            transform: scale(0.9) translateY(30px);
            transition: opacity 1s var(--ease-liquid), transform 1s var(--ease-liquid);
        }

        .container.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* --- КАСКАДНАЯ АНИМАЦИЯ ЭЛЕМЕНТОВ --- */
        .title-wrapper,
        .corner-cross,
        .link-item,
        .music-box {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.7s var(--ease-liquid), transform 0.7s var(--ease-liquid);
        }

        .container.visible .corner-cross {
            opacity: 0.3;
            transform: translateY(0);
            transition-delay: 0.1s;
        }

        .container.visible .title-wrapper {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.15s;
        }

        /* Поочередное всплытие кнопок */
        .container.visible .link-item:nth-child(1) { opacity: 1; transform: translateY(0); transition-delay: 0.25s; }
        .container.visible .link-item:nth-child(2) { opacity: 1; transform: translateY(0); transition-delay: 0.32s; }
        .container.visible .link-item:nth-child(3) { opacity: 1; transform: translateY(0); transition-delay: 0.39s; }
        .container.visible .link-item:nth-child(4) { opacity: 1; transform: translateY(0); transition-delay: 0.46s; }
        .container.visible .link-item:nth-child(5) { opacity: 1; transform: translateY(0); transition-delay: 0.53s; }

        .container.visible .music-box {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.62s;
        }

        /* Угловые готические кресты */
        .corner-cross {
            position: absolute;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            user-select: none;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }
        .container:hover .corner-cross {
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }
        .cross-tl { top: 16px; left: 18px; }
        .cross-tr { top: 16px; right: 18px; }
        .cross-bl { bottom: 16px; left: 18px; }
        .cross-br { bottom: 16px; right: 18px; }

        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .title-cross {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.4);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .title-wrapper:hover .title-cross {
            color: #ffffff;
            transform: rotate(90deg);
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.8);
        }

        h1 {
            font-family: 'MedievalSharp', cursive;
            font-size: 3.3rem;
            font-weight: 400;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 255, 255, 0.35);
            user-select: none;
            line-height: 1;
        }

        /* --- СЕТКА КНОПОК --- */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            margin-bottom: 26px;
        }

        .link-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 13px 12px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.015) 100%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #e2e2e8;
            text-decoration: none;
            font-size: 0.82rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 
                0 6px 18px rgba(0, 0, 0, 0.3),
                inset 0 1px 1px rgba(255, 255, 255, 0.35);
            overflow: hidden;
        }

        /* Ховер-эффект кнопок после их появления */
        .container.visible .link-item {
            transition: transform 0.3s var(--ease-liquid), background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
        }

        .link-item.featured {
            grid-column: span 2;
            padding: 15px 12px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.02) 100%);
            border-color: rgba(255, 255, 255, 0.24);
        }

        .link-item i {
            font-size: 0.95rem;
            color: var(--text-dim);
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .link-item:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            border-color: rgba(255, 255, 255, 0.5);
            color: #ffffff;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 12px 25px rgba(0, 0, 0, 0.55),
                0 0 20px rgba(255, 255, 255, 0.18),
                inset 0 1.5px 2px rgba(255, 255, 255, 0.6);
        }

        .link-item:hover i {
            color: #ffffff;
            transform: scale(1.15);
        }

        /* --- СТЕКЛЯННЫЙ МЕДИАПЛЕЕР --- */
        .music-box {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.015) 100%);
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 
                0 10px 26px rgba(0, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
        }

        .cover-art {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.35);
            flex-shrink: 0;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .music-box:hover .cover-art {
            transform: scale(1.03);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.7);
        }

        .player-controls {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - 74px);
            gap: 8px;
        }

        .track-name {
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
        }

        .slider-common {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            outline: none;
            height: 12px;
        }

        .slider-common::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 11px;
            width: 6px;
            border-radius: 3px;
            background: #ffffff;
            margin-top: -4.5px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .slider-common::-moz-range-thumb {
            height: 11px;
            width: 6px;
            border-radius: 3px;
            background: #ffffff;
            border: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .slider-common::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 2px;
        }

        .slider-common::-moz-range-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 2px;
        }

        .progress-slider {
            width: 100%;
        }

        .bottom-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .left-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .play-btn {
            background: none;
            border: none;
            color: #d4d4d8;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            transition: color 0.2s, transform 0.2s;
        }
        
        .play-btn:hover {
            color: #ffffff;
            transform: scale(1.18);
        }

        .time-text {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            user-select: none;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 70px;
            flex-shrink: 0;
        }

        .volume-box i {
            color: var(--text-dim);
            font-size: 0.75rem;
            transition: color 0.2s;
        }

        .volume-box i:hover {
            color: #ffffff;
        }

        .volume-slider {
            width: 100%;
        }

        @media (max-width: 480px) {
            .container { padding: 32px 18px; border-radius: 26px; }
            h1 { font-size: 2.8rem; }
            .links-grid { grid-template-columns: 1fr; }
            .link-item.featured { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <canvas id="ashCanvas"></canvas>

    <!-- Основная карточка профиля -->
    <div class="container" id="mainContainer">
        <span class="corner-cross cross-tl">✠</span>
        <span class="corner-cross cross-tr">✠</span>
        <span class="corner-cross cross-bl">✠</span>
        <span class="corner-cross cross-br">✠</span>

        <div class="title-wrapper">
            <span class="title-cross">♰</span>
            <h1 id="titleName">kamizchuk</h1>
            <span class="title-cross">♰</span>
        </div>

        <div class="links-grid">
            <a href="https://steamcommunity.com/id/kamizchuk/" target="_blank" rel="noopener noreferrer" class="link-item">
                <i class="fab fa-steam-symbol"></i> Steam
            </a>
            <a href="https://t.me/kamizchuk" target="_blank" rel="noopener noreferrer" class="link-item">
                <i class="fab fa-telegram-plane"></i> Telegram
            </a>
            <a href="https://youtube.com/@kamizchuk?si=OacBrP33uK_nkmfv" target="_blank" rel="noopener noreferrer" class="link-item">
                <i class="fab fa-youtube"></i> YouTube
            </a>
            <a href="https://discord.com/users/1226305136582856896" target="_blank" rel="noopener noreferrer" class="link-item">
                <i class="fab fa-discord"></i> Discord
            </a>
            <a href="https://nude-moon.org/perevod/kamizu_kun" target="_blank" rel="noopener noreferrer" class="link-item featured">
                <i class="fas fa-torii-gate"></i> Manga Translation
            </a>
        </div>

        <div class="music-box">
            <img src="cover.jpg" alt="Cover" class="cover-art" onerror="this.src='https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=200&auto=format&fit=crop'">
            
            <div class="player-controls">
                <div class="track-name" title="Cannibalism">Cannibalism</div>
                
                <input type="range" class="slider-common progress-slider" id="progressSlider" min="0" max="100" value="0" step="0.1">
                
                <div class="bottom-controls">
                    <div class="left-controls">
                        <button class="play-btn" id="playBtn" aria-label="Play/Pause">
                            <i class="fas fa-play"></i>
                        </button>
                        <div class="time-text">
                            <span id="currentTime">00:00</span> / <span id="durationTime">00:00</span>
                        </div>
                    </div>
                    
                    <div class="volume-box">
                        <i class="fas fa-volume-up" id="volumeIcon" title="Mute"></i>
                        <input type="range" class="slider-common volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
                    </div>
                </div>

                <audio id="audioElement" preload="auto" autoplay>
                    <source src="cannibalism.mp3" type="audio/mpeg">
                </audio>
            </div>
        </div>
    </div>

    <script>
        // --- 1. АНИМАЦИЯ ВКЛАДКИ (Печать kamizu) ---
        const targetTitle = "kamizu";
        let charIndex = 0;
        let isDeleting = false;

        function typeTitle() {
            if (!isDeleting) {
                charIndex++;
                document.title = targetTitle.substring(0, charIndex);
                if (charIndex === targetTitle.length) {
                    isDeleting = true;
                    setTimeout(typeTitle, 1400);
                    return;
                }
            } else {
                charIndex--;
                document.title = targetTitle.substring(0, charIndex) || "_";
                if (charIndex === 0) {
                    isDeleting = false;
                    setTimeout(typeTitle, 400);
                    return;
                }
            }
            setTimeout(typeTitle, isDeleting ? 140 : 220);
        }
        typeTitle();

        // --- 2. АВТОМАТИЧЕСКОЕ ПОЯВЛЕНИЕ КАРТОЧКИ И ЗАПУСК МУЗЫКИ ---
        const mainContainer = document.getElementById('mainContainer');
        const audio = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');
        const volumeSlider = document.getElementById('volumeSlider');

        audio.volume = volumeSlider.value;

        // Все возможные события: движение мыши, колесико, скролл, касания, клики и клавиши
        const unlockEvents = [
            'mousemove', 
            'pointermove', 
            'mouseover', 
            'wheel', 
            'scroll', 
            'mousedown', 
            'pointerdown', 
            'touchstart', 
            'touchmove', 
            'keydown', 
            'click'
        ];

        let isTryingToPlay = false;

        function removeUnlockListeners() {
            unlockEvents.forEach(evt => 
                window.removeEventListener(evt, unlockAudioOnInteraction, { passive: true })
            );
        }

        function unlockAudioOnInteraction(e) {
            // Если пользователь кликнул прямо по кнопке Play/Pause, не мешаем стандартному обработчику
            if (e && e.target && playBtn.contains(e.target)) return;
            if (!audio.paused || isTryingToPlay) return;

            isTryingToPlay = true;
            audio.play().then(() => {
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                removeUnlockListeners(); // Убираем слушатели только когда музыка реально заиграла
                isTryingToPlay = false;
            }).catch(() => {
                // Если браузер не принял движение мыши за достаточный триггер, 
                // сбрасываем флаг и продолжаем ловить следующие движения/клики
                isTryingToPlay = false;
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Плавная отрисовка карточки при входе
            setTimeout(() => {
                mainContainer.classList.add('visible');
            }, 50);

            // Вешаем слушатели на движение мышки и остальные действия
            unlockEvents.forEach(evt => 
                window.addEventListener(evt, unlockAudioOnInteraction, { passive: true })
            );

            // И сразу пробуем запустить при загрузке
            unlockAudioOnInteraction();
        });

        // --- 3. ПЛЕЕР ---
        const progressSlider = document.getElementById('progressSlider');
        const volumeIcon = document.getElementById('volumeIcon');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        let isDragging = false;
        let prevVolume = 0.5;

        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }

        audio.addEventListener('loadedmetadata', () => {
            if (!isNaN(audio.duration)) {
                durationTimeEl.textContent = formatTime(audio.duration);
                progressSlider.max = audio.duration;
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (!isDragging) {
                currentTimeEl.textContent = formatTime(audio.currentTime);
                progressSlider.value = audio.currentTime;
            }
        });

        progressSlider.addEventListener('mousedown', () => isDragging = true);
        progressSlider.addEventListener('touchstart', () => isDragging = true, { passive: true });
        progressSlider.addEventListener('input', () => {
            currentTimeEl.textContent = formatTime(progressSlider.value);
        });

        const syncSeek = () => {
            audio.currentTime = progressSlider.value;
            isDragging = false;
        };
        progressSlider.addEventListener('change', syncSeek);
        progressSlider.addEventListener('mouseup', syncSeek);
        progressSlider.addEventListener('touchend', syncSeek);

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            volumeIcon.className = audio.volume == 0 ? "fas fa-volume-mute" : "fas fa-volume-up";
        });

        volumeIcon.addEventListener('click', () => {
            if (audio.volume > 0) {
                prevVolume = audio.volume;
                audio.volume = 0;
                volumeSlider.value = 0;
                volumeIcon.className = "fas fa-volume-mute";
            } else {
                audio.volume = prevVolume || 0.5;
                volumeSlider.value = audio.volume;
                volumeIcon.className = "fas fa-volume-up";
            }
        });

        playBtn.addEventListener('click', () => {
            removeUnlockListeners(); // Отключаем автозапуск от мышки, если юзер сам управляет плеером
            if (audio.paused) audio.play();
            else audio.pause();
        });

        audio.addEventListener('play', () => {
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            removeUnlockListeners();
        });
        audio.addEventListener('pause', () => playBtn.innerHTML = '<i class="fas fa-play"></i>');
        audio.addEventListener('ended', () => {
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            audio.currentTime = 0;
        });

        // --- 4. МЕДЛЕННО ВОСХОДЯЩИЙ ПЕПЕЛ ---
        const canvas = document.getElementById('ashCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const particles = [];
        const count = window.innerWidth < 600 ? 40 : 80;

        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.8 + 0.6,
                speedY: Math.random() * 0.7 + 0.2,
                speedX: (Math.random() - 0.5) * 0.4,
                opacity: Math.random() * 0.6 + 0.15
            });
        }

        function renderAsh() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.fillStyle = `rgba(220, 220, 230, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                p.y -= p.speedY;
                p.x += p.speedX;

                if (p.y < -10) {
                    p.y = canvas.height + 10;
                    p.x = Math.random() * canvas.width;
                }
            }
            requestAnimationFrame(renderAsh);
        }
        renderAsh();
    </script>
</body>
</html>
